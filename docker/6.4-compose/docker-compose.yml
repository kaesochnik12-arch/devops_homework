version: '3'
services:
  server:
    build: .
    command: python snake.py
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    volumes:
      - ./onlinesnake.template:/etc/nginx/conf.d/onlinesnake.template
      - ./web/:/var/www/onlinesnake.fun/
    ports:
      - 8080:80
    command: /bin/sh -c "cat /etc/nginx/conf.d/onlinesnake.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: gilmutdinov-rg-netology-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
  pushgateway:
    image: prom/pushgateway:latest
    container_name: gilmutdinov-rg-netology-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: gilmutdinov-rg-netology-grafana
    ports: 
      - "80:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./custom.ini:/etc/grafana/custom.ini:ro
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/custom.ini
    depends_on:
    - prometheus
    restart: unless-stopped
networks:
  default:
    name: gilmutdinov-rg-my-netology-hw
    ipam:
      config:
        - subnet: 10.5.0.0/16 
volumes: 
  prometheus_data:
  grafana_data:
